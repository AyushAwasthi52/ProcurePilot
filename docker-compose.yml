version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: procurepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: procurepilot
      POSTGRES_PASSWORD: procurepilot_dev
      POSTGRES_DB: procurepilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurepilot -d procurepilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

